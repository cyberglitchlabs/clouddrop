---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
spec:
  interval: 1h
  chart:
    spec:
      chart: emqx
      version: 5.8.9
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: Secret
      name: emqx-secrets
      valuesKey: adminPassword
      targetPath: emqxConfig.EMQX_DASHBOARD__DEFAULT_PASSWORD
  values:
    replicaCount: 3
    emqxConfig:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      # EMQX re-reads these files every ~120s, so cert-manager renewals need no restart
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /tmp/ssl/tls.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /tmp/ssl/tls.key
    ssl:
      enabled: true
      commonName: "mqtt.${SECRET_DOMAIN}" # yayamlls-disable-line
      dnsnames: ["mqtt.${SECRET_DOMAIN}"] # yayamlls-disable-line
      issuer:
        name: letsencrypt-production
        kind: ClusterIssuer
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    podSecurityContext:
      enabled: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop: ["ALL"]
