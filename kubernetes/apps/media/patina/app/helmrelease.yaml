---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: patina
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bjw-s-app-template
    namespace: flux-system
  values:
    controllers:
      patina:
        strategy: Recreate # RWO SQLite volume: stop the old pod first
        pod:
          terminationGracePeriodSeconds: 90 # lets an in-flight merge finish
        containers:
          app:
            image:
              repository: ghcr.io/cyberglitchlabs/patina
              tag: sha-ad83b76
            env:
              PATINA_CONFIG: /etc/patina/patina.toml
              TZ: America/Chicago
            envFrom:
              - secretRef:
                  name: patina-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: 8080 }
                  periodSeconds: 2
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: 8080 }
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/local/bin/patina", "healthcheck"]
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: patina
        ports:
          http:
            port: 8080
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: patina-data
        globalMounts:
          - path: /data
      config:
        type: secret
        name: patina-secret
        advancedMounts:
          patina:
            app:
              - path: /etc/patina/patina.toml
                subPath: patina.toml
                readOnly: true
