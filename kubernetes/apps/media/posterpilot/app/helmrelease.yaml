---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: posterpilot
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bjw-s-app-template
    namespace: flux-system
  dependsOn:
    - name: cloudflare-tunnel
      namespace: network
    - name: jellyfin
  values:
    controllers:
      posterpilot:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/diegopeixoto/posterpilot
              tag: "0.10.0"
            env:
              TZ: America/Chicago
              SERVER_TYPE: jellyfin
              AUTH_MODE: enabled
              JELLYFIN_URL:
                valueFrom:
                  secretKeyRef:
                    name: posterpilot-secret
                    key: JELLYFIN_URL
              JELLYFIN_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: posterpilot-secret
                    key: JELLYFIN_API_KEY
              TMDB_KEY:
                valueFrom:
                  secretKeyRef:
                    name: posterpilot-secret
                    key: TMDB_KEY
              FANART_KEY:
                valueFrom:
                  secretKeyRef:
                    name: posterpilot-secret
                    key: FANART_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: posterpilot
        ports:
          http:
            port: 3000
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: posterpilot-juicefs
        globalMounts:
          - path: /data
      kometa:
        type: emptyDir
        globalMounts:
          - path: /kometa
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
