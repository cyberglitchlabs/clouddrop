---
# Statically provisioned iSCSI LUN on the QNAP (target "khal-drogo", same
# target as jellyfin's, LUN 5). Replaces posterpilot-juicefs -- same
# JuiceFS FUSE locking issues that hit jellyfin's DB are hitting these
# apps' SQLite dbs too (see jellyfin-juicefs-mount-oom-corruption memory;
# sonarr has been logging "SQLiteException: locking protocol" crashes).
# Real local block device once attached, giving SQLite genuine POSIX
# filesystem semantics.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: posterpilot-config-iscsi
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: org.democratic-csi.node-manual
    readOnly: false
    fsType: xfs
    volumeHandle: posterpilot-config-iscsi
    volumeAttributes:
      portal: "192.168.100.180:3260"
      iqn: "iqn.2004-04.com.qnap:ts-873:iscsi.target-0.2d0e53"
      lun: "5"
      node_attach_driver: iscsi
      provisioner_driver: node-manual
