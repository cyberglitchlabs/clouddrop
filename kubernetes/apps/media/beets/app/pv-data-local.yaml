---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: beets-data-local
spec:
  capacity: { storage: 2Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [bolty] }
  hostPath: { path: /var/mnt/beets-data, type: DirectoryOrCreate }
