---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/main/config/crd/bases/postgresql.cnpg.io_clusters.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarr-postgres
  namespace: media
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: sonarr
      owner: sonarr
      postInitSQL:
        - CREATE DATABASE sonarr_logs;
        - ALTER DATABASE sonarr_logs OWNER TO sonarr;
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: 128MB
  storage:
    size: 5Gi
    storageClass: qnap-nfs
  monitoring:
    enablePodMonitor: true
