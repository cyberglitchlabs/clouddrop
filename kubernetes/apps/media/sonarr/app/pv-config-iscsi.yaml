---
# Statically provisioned iSCSI LUN on the QNAP (target "khal-drogo", same
# target as jellyfin's, LUN 4). Replaces sonarr-juicefs -- sonarr has been
# crashing on "SQLiteException: locking protocol" (105k+ readiness-probe
# failures over 15 days), the same JuiceFS FUSE locking failure class that
# corrupted jellyfin's DB (see jellyfin-juicefs-mount-oom-corruption
# memory). Real local block device once attached, giving SQLite genuine
# POSIX filesystem semantics.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-config-iscsi
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # node-manual has no controller service / attach coordination -- pin to
  # the node the iSCSI session actually lives on (see jellyfin's
  # pv-config-iscsi.yaml for the full rationale). Without this, a pod
  # reschedule to a different node risks double-mounting the same LUN.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - bolty
  csi:
    driver: org.democratic-csi.node-manual
    readOnly: false
    fsType: xfs
    volumeHandle: sonarr-config-iscsi
    volumeAttributes:
      portal: "192.168.100.180:3260"
      iqn: "iqn.2004-04.com.qnap:ts-873:iscsi.target-0.2d0e53"
      lun: "4"
      node_attach_driver: iscsi
      provisioner_driver: node-manual
