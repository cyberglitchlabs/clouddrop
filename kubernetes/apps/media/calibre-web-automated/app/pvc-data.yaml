---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-automated-data
  namespace: media
  labels:
    # Opt out of the "default" snapshot and backup jobs. The group below has no
    # jobs; backups are taken by hand after each approved batch.
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/ebook-cleanup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single
  resources:
    requests:
      storage: 80Gi
