---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: etcd-backup-pvc
            - name: talos-secrets
              secret:
                secretName: etcd-backup-secret
          containers:
            - name: talosctl
              image: alpine:3.24
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # Install dependencies
                  apk add --no-cache curl bash

                  # Download talosctl
                  echo "Downloading talosctl..."
                  curl -L -o /usr/local/bin/talosctl https://github.com/siderolabs/talos/releases/download/v1.11.5/talosctl-linux-amd64
                  chmod +x /usr/local/bin/talosctl

                  # Ensure backup directory exists
                  mkdir -p /backups

                  # Create filename with timestamp
                  FILENAME="etcd-snapshot-$(date +%s).snapshot"

                  echo "Creating snapshot: /backups/$FILENAME"

                  # Take the snapshot against each control plane node in turn,
                  # stopping at the first success. Keep this list in sync with
                  # the controlPlane nodes declared in talos/talconfig.yaml.
                  SUCCEEDED=""
                  for NODE in 192.168.42.253 192.168.42.252 192.168.42.250; do
                      echo "Attempting backup on $NODE..."
                      if talosctl -n "$NODE" etcd snapshot "/backups/$FILENAME" --talosconfig=/var/secrets/talosconfig; then
                          echo "Backup successful on $NODE!"
                          SUCCEEDED="$NODE"
                          break
                      fi
                      echo "Backup failed on $NODE."
                  done

                  if [ -z "$SUCCEEDED" ]; then
                      echo "Backup failed on every control plane node!"
                      exit 1
                  fi

                  # Cleanup old backups (keep last 10).
                  # Snapshot names embed a zero-padded epoch, so a reverse
                  # lexical sort is newest-first. Avoid GNU-only find -printf
                  # and xargs -r; this image ships BusyBox.
                  ls -1 /backups/etcd-snapshot-*.snapshot 2>/dev/null \
                      | sort -r \
                      | tail -n +11 \
                      | while read -r OLD; do
                          echo "Pruning old snapshot: $OLD"
                          rm -f "$OLD"
                      done
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: talos-secrets
                  mountPath: /var/secrets
          restartPolicy: OnFailure
