---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-topology-spread
  annotations:
    policies.kyverno.io/title: Add Topology Spread to Deployments
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/description: >-
      Injects a soft hostname topology spread constraint into all Deployments
      that don't already have one, encouraging balanced pod distribution across
      cluster nodes. Uses the Deployment's own selector as the labelSelector and
      matchLabelKeys with pod-template-hash so sibling pods are grouped correctly.
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          !has(object.spec.template.spec.topologySpreadConstraints) && has(object.spec.selector.matchLabels) ?
          [
            JSONPatch{
              op: "add",
              path: "/spec/template/spec/topologySpreadConstraints",
              value: dyn([
                dyn({
                  "maxSkew": dyn(1),
                  "topologyKey": dyn("kubernetes.io/hostname"),
                  "whenUnsatisfiable": dyn("ScheduleAnyway"),
                  "labelSelector": dyn({"matchLabels": dyn(object.spec.selector.matchLabels)}),
                  "matchLabelKeys": dyn(["pod-template-hash"])
                })
              ])
            }
          ] : []
