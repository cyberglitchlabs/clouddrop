---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 1h
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
      interval: 1h
  values:
    csiDriver:
      # Statically attaches pre-created LUNs/shares — no dynamic
      # provisioning, so no backend credentials or QNAP API calls at all.
      # (See kubernetes/apps/storage/qnap-csi-plugin history: the QNAP/Trident
      # dynamic-provisioning driver overloaded this same NAS's API and was
      # removed. node-manual sidesteps that entire failure class by design.)
      name: org.democratic-csi.node-manual
      # node-manual advertises no controller service at all (confirmed live:
      # GetPluginCapabilities returns {}) -- there's nothing for a
      # ControllerPublishVolume call to reach, so don't make Kubernetes wait
      # on one.
      attachRequired: false

    driver:
      config:
        driver: node-manual
      image:
        tag: v1.9.5
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    # node-manual has no controller service (verified: external-resizer
    # crash-looped with "CSI driver does not support controller service").
    # Nothing for attacher/provisioner/resizer to call -- the whole
    # controller deployment is dead weight for this driver mode.
    controller:
      enabled: false

    node:
      # Talos: iscsiadm lives on the host via the iscsi-tools system
      # extension (already installed on all nodes, see talos/talconfig.yaml)
      # and must be reached via nsenter rather than run in-container.
      hostPID: true
      driver:
        image:
          tag: v1.9.5
        iscsiDirHostPath: /usr/local/etc/iscsi
        iscsiDirHostPathType: ""
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      driverRegistrar:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
