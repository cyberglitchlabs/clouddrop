---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No helmrelease-defaults component: it forces upgrade remediation retries: 3,
# and Longhorn must never be rolled back automatically.
resources:
  - ./namespace.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./podmonitor.yaml
  - ./networkpolicy-metrics.yaml
  - ./prometheusrule.yaml
