---
# Jobs in the "default" group apply to every Longhorn volume that has no
# explicit recurring-job labels, so new apps are covered automatically.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-6h
  namespace: longhorn-system
spec:
  task: snapshot
  cron: "0 */6 * * *"
  retain: 8
  concurrency: 2
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  task: backup
  cron: "30 3 * * *"
  retain: 7
  concurrency: 2
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  task: backup
  cron: "30 4 * * 0"
  retain: 4
  concurrency: 1
  groups:
    - default
