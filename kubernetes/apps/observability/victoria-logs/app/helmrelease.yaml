---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chart:
    spec:
      # Pinned below latest (0.13.9 / v1.52.0) - that app version fatally
      # panics on startup on duplicate stream tag keys (e.g. two "namespace"
      # entries from a single Loki push), which VictoriaLogs itself writes
      # without deduplicating on ingest. Fixed by PR #1606, merged
      # 2026-07-20 - 4 days after v1.52.0 was built, so no released chart
      # has the fix yet. Bump back to latest once one does.
      # https://github.com/VictoriaMetrics/VictoriaLogs/issues/1628
      # https://github.com/VictoriaMetrics/VictoriaLogs/pull/1606
      chart: victoria-logs-single
      version: "0.13.9"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    server:
      persistentVolume:
        enabled: true
        storageClassName: juicefs
        size: 20Gi
      retentionPeriod: 30d
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
