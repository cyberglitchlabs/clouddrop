---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chart:
    spec:
      # Pinned below latest (0.13.9 / v1.52.0) - that app version fatally
      # panics on startup on duplicate stream tag keys (e.g. two "namespace"
      # entries from a single Loki push), which VictoriaLogs itself writes
      # without deduplicating on ingest. Fixed by PR #1606, merged
      # 2026-07-20 - 4 days after v1.52.0 was built, so no released chart
      # has the fix yet. Bump back to latest once one does.
      # https://github.com/VictoriaMetrics/VictoriaLogs/issues/1628
      # https://github.com/VictoriaMetrics/VictoriaLogs/pull/1606
      chart: victoria-logs-single
      version: "0.13.9"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    server:
      # Workaround for lib/filestream panicking on any fsync error, including
      # transient EIO from the juicefs-backed PVC. Upstream tracked this as
      # a sub-issue of the object storage support epic, but the actual code
      # (unconditional logger.Panicf on fsync failure) hasn't shipped a fix -
      # any fsync error still hard-crashes the process, and since VictoriaLogs
      # retries the same merge on every restart, one transient EIO becomes a
      # permanent crash loop. DISABLE_FSYNC_FOR_TESTING=true (despite the
      # name, it's a real runtime env var, not test-only) skips all fsync
      # calls in lib/fs and lib/filestream. Trade-off: recent writes are no
      # longer fsync'd to the backing store, so a hard pod kill / node crash
      # could lose the last few seconds of buffered log data - acceptable
      # here since this is a log store, not a source of truth. Revert once
      # fsync errors are handled gracefully instead of panicking.
      # https://github.com/VictoriaMetrics/VictoriaLogs/issues/747
      # https://github.com/VictoriaMetrics/VictoriaLogs/issues/48
      env:
        - name: DISABLE_FSYNC_FOR_TESTING
          value: "true"
      persistentVolume:
        enabled: true
        storageClassName: juicefs
        size: 20Gi
      retentionPeriod: 30d
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
